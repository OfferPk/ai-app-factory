name: 24/7 AI App Factory Automation

on:
  schedule:
    # ہر 6 گھنٹے بعد خودکار چلے گا
    - cron: '0 */6 * * *'
  workflow_dispatch: # اس سے Run workflow کا بٹن آئے گا

jobs:
  create-new-app:
    runs-on: ubuntu-latest
    steps:
      - name: کوڈ چیک آؤٹ کریں
        uses: actions/checkout@v4

      - name: پائتھون سیٹ اپ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ضروری لائبریری انسٹال کریں
        run: pip install requests

      - name: روبوٹ رن کریں
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python generator.py
